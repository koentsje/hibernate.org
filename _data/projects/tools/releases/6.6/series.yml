summary: Release compatible with Hibernate ORM 6.6
maven:
  artifacts:
    - artifact_id: hibernate-tools-orm
      summary: Core implementation
    - artifact_id: hibernate-tools-maven
      summary: Maven support
    - artifact_id: hibernate-tools-gradle
      summary: Gradle support
    - artifact_id: hibernate-tools-ant
      summary: Ant support
    - artifact_id: hibernate-tools-jbt
      summary: Eclipse plugin support
    - artifact_id: hibernate-tools-utils
      summary: Various utilities
integration_constraints:
  java:
    version: 11, 17, 20, 21, 22 or 23
  orm:
    version: 6.6